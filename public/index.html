  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }

  @keyframes spin { to { transform: rotate(360deg); } }

  .fade-up { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }
  .fade-in { animation: fadeIn .4s ease both; }
  .pop { animation: pop .4s cubic-bezier(.16,1,.3,1) both; }
  .slide-in { animation: slideIn .35s ease both; }

  .app-shell { max-width: 540px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
  .app-shell.desktop { max-width: 1280px; }

  /* desktop two-column: editor left, sticky preview right */
  .work-grid { display: block; }
  .desktop .work-grid {
    display: grid;
    grid-template-columns: minmax(420px, 1fr) minmax(440px, 1.05fr);
    gap: 28px;
    align-items: start;
    padding: 22px 26px 0;
  }
  .desktop .editor-col { min-width: 0; }
  .desktop .preview-col {
    position: sticky; top: 84px; align-self: start;
    max-height: calc(100vh - 104px); overflow: auto;
  }
  .desktop .preview-col::-webkit-scrollbar { width: 8px; }

  /* generic */
  .press { transition: transform .12s ease, box-shadow .2s ease, background .2s ease; }
  .press:active { transform: scale(.96); }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
    padding: 6px 11px; border-radius: 99px; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); transition: all .15s ease;
  }
  .tag:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
  .field {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; font-size: 14px; color: var(--ink); outline: none; transition: all .18s ease;

  .field::placeholder { color: var(--ink-faint); }
  .label { display:block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 7px; }

  .skeleton { background: linear-gradient(90deg,#eef2f7 25%,#e2e8f0 37%,#eef2f7 63%); background-size: 800px 100%; animation: shimmer 1.4s infinite linear; }

/* ================================================================
   PREVIEW PANE (scales the 794px canvas to fit)
================================================================ */
function PreviewPane({ data, lang, density, scale, canvasRef, tpl }) {
  const wrapRef = useRef(null);
  const [fit, setFit] = useState(0.5);
  useEffect(() => {
    const calc = () => {
      if (!wrapRef.current) return;
      const w = wrapRef.current.clientWidth - 4;
      setFit(Math.min(1, w / 794));
    };
    calc();
    const ro = new ResizeObserver(calc);
    if (wrapRef.current) ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);
  const eff = fit * (scale/100);
  return (
    <div ref={wrapRef} style={{width:"100%",overflow:"hidden",borderRadius:16,background:"#fff",boxShadow:"var(--shadow-md)",border:"1px solid var(--line)"}}>
      <div style={{transform:`scale(${eff})`,transformOrigin:"top left",width:794,height:"auto"}}>
        <ResumePreview data={data} lang={lang} density={density} fwd={canvasRef} tpl={tpl} />
      </div>
    </div>
  );
}

<script type="text/babel" data-presets="react">
/* personal, about, work, education, skills, certs, languages, review, done */
function Inp({label, value, onChange, ph, removable, onRemove}) {
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span className="label">{label}</span>
        {removable && <button onClick={onRemove} style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:"var(--ink-faint)",fontWeight:600}}>{Icon.trash}</button>}
      </div>
      <input className="field" value={value} placeholder={ph} onChange={e=>onChange(e.target.value)} />
    </div>
  );
}

function StepPersonal({ lang, data, set }) {
  const L = LABELS[lang];
  const p = data.personal;
  const upd = (k,v) => set(d=>({...d,personal:{...d.personal,[k]:v}}));
  const onFile = (e) => {
    const f = e.target.files?.[0]; if(!f) return;
    const r = new FileReader(); r.onload = () => upd("photo", r.result); r.readAsDataURL(f);
  };

  // Optional add-able fields: hidden until the user adds them (or already filled via sample)
  const OPTIONAL = [
    { key:"military", label:L.pdMil, ph:"Safarbarlik zahirasi" },
    { key:"driverLicense", label:L.pdLic, ph:"B toifasi" },
    { key:"monthlySalary", label:L.pdSalary, ph:"$2,500" },
  ];
  const [shown, setShown] = useState(() => OPTIONAL.filter(o => (p[o.key]||"").trim()).map(o => o.key));
  // keep visible any field that gained a value (e.g. after loading a sample)
  useEffect(() => {
    setShown(prev => {
      const withValue = OPTIONAL.filter(o => (p[o.key]||"").trim()).map(o => o.key);
      const merged = Array.from(new Set([...prev, ...withValue]));
      return merged.length === prev.length ? prev : merged;
    });
  }, [p.military, p.driverLicense, p.monthlySalary]);

  const addField = (k) => setShown(s => s.includes(k) ? s : [...s, k]);
  const removeField = (k) => { upd(k, ""); setShown(s => s.filter(x => x !== k)); };
  const hidden = OPTIONAL.filter(o => !shown.includes(o.key));

  return (
    <div className="fade-up">
      <StepHeader icon={Icon.user} title={I18N[lang].steps[2]} badge={I18N[lang].required} badgeColor="req" />
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Inp label={L.pdName} value={p.fullName} onChange={v=>upd("fullName",v)} ph="Temur Aliyev"/>
        <Inp label={L.pdRole} value={p.jobTitle} onChange={v=>upd("jobTitle",v)} ph="Senior Frontend Developer"/>
      </div>
      <div style={{marginTop:14,background:"#f8fafc",border:"1px solid var(--line)",borderRadius:14,padding:14}}>
        <span className="label">{L.pdPhoto}</span>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:54,height:54,borderRadius:12,border:"1.5px dashed var(--line)",background:"#fff",overflow:"hidden",display:"grid",placeItems:"center",flexShrink:0,color:"var(--ink-faint)"}}>
            {p.photo ? <img src={p.photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/> : Icon.user}
          </div>
          <div style={{flex:1}}>
            <label className="press" style={{display:"inline-block",background:"#eff6ff",color:"var(--brand)",fontWeight:700,fontSize:12,padding:"8px 14px",borderRadius:10,cursor:"pointer"}}>
              {L.pdUpload}<input type="file" accept="image/*" onChange={onFile} style={{display:"none"}}/>
            </label>
            <span style={{fontSize:11,color:"var(--ink-faint)",marginLeft:8}}>{p.photo?"":L.pdNoPhoto}</span>
            <div style={{display:"flex",alignItems:"center",gap:7,marginTop:9}}>
              <span style={{fontSize:10.5,fontWeight:700,color:"var(--ink-soft)"}}>{L.pdSamples}</span>
              {AVATARS.map((a,i)=><img key={i} src={a} onClick={()=>upd("photo",a)} className="press" style={{width:26,height:26,borderRadius:99,cursor:"pointer",border:p.photo===a?"2px solid var(--brand)":"2px solid transparent",objectFit:"cover"}}/>)}
            </div>
          </div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginTop:14}}>
        <Inp label={L.pdAge} value={p.age} onChange={v=>upd("age",v)} ph="26 yosh / 2000"/>
        <Inp label={L.pdEdu} value={p.educationLevel} onChange={v=>upd("educationLevel",v)} ph="Oliy (Bakalavr)"/>
        <Inp label={L.pdTg} value={p.telegram} onChange={v=>upd("telegram",v)} ph="@username"/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginTop:14}}>
        <Inp label={L.pdPhone} value={p.phone} onChange={v=>upd("phone",v)} ph="+998 90 123 45 67"/>
        <Inp label={L.pdEmail} value={p.email} onChange={v=>upd("email",v)} ph="email@devtech.uz"/>
        <Inp label={L.pdAddr} value={p.address} onChange={v=>upd("address",v)} ph="Toshkent sh."/>
      </div>

      {/* Revealed optional fields */}
      {shown.length > 0 && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginTop:14}}>
          {OPTIONAL.filter(o => shown.includes(o.key)).map(o => (
            <div key={o.key} className="slide-in">
              <Inp label={o.label} value={p[o.key]} onChange={v=>upd(o.key,v)} ph={o.ph} removable onRemove={()=>removeField(o.key)}/>
            </div>
          ))}
        </div>
      )}

      {/* Add chips for hidden optional fields */}
      {hidden.length > 0 && (
        <div style={{marginTop:16,paddingTop:14,borderTop:"1px dashed var(--line)"}}>
          <div style={{fontSize:10.5,fontWeight:800,letterSpacing:".04em",color:"var(--ink-soft)",marginBottom:9}}>{L.pdAddField}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {hidden.map(o => (
              <button key={o.key} className="tag press" onClick={()=>addField(o.key)} style={{borderStyle:"dashed",borderColor:"#bfdbfe",color:"var(--brand)"}}>
                {Icon.plus}<span style={{marginLeft:2}}>{o.label}</span>
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

  const L = LABELS[lang];

/* ================================================================
   ADMIN PANEL — built into the site, opened by the hidden lock icon.
   Global data via /api/admin-data (KV-backed), gated by ADMIN_KEY.
================================================================ */
function AdminPanel({ onClose }) {
  const [key, setKey] = useState(() => { try { return sessionStorage.getItem("rez_admin_key") || ""; } catch(e){ return ""; } });
  const [authed, setAuthed] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [data, setData] = useState({ stats:{}, payments:[], events:[] });
  const [tab, setTab] = useState("payments"); // payments | activity
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all"); // all | pending | approved | rejected
  const pollRef = useRef(null);

  const fetchData = async (k) => {
    const useKey = k != null ? k : key;
    try {
      const res = await fetch("/api/admin-data?key=" + encodeURIComponent(useKey));
      if (res.status === 401) { setErr("Noto'g'ri kalit (wrong key)"); setAuthed(false); return false; }
      const j = await res.json();
      if (!j.ok) { setErr(j.error || "error"); return false; }
      setData({ stats:j.stats||{}, payments:j.payments||[], events:j.events||[] });
      setErr("");
      return true;
    } catch(e) { setErr("Ulanish xatosi (network)"); return false; }
  };

  const login = async () => {
    if (!key.trim()) return;
    setLoading(true);
    const ok = await fetchData(key.trim());
    setLoading(false);
    if (ok) {
      setAuthed(true);
      try { sessionStorage.setItem("rez_admin_key", key.trim()); } catch(e){}
      if (pollRef.current) clearInterval(pollRef.current);
      pollRef.current = setInterval(() => fetchData(), 5000);
    }
  };
  useEffect(() => { if (key) login(); /* auto-login if key remembered */ }, []);
  useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  const decide = async (id, action) => {
    try {
      const res = await fetch("/api/pay-admin", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ key, id, action }) });
      const j = await res.json();
      if (!j.ok) { alert("Xato: " + (j.error||"")); return; }
      fetchData();
    } catch(e){ alert("Ulanish xatosi"); }
  };

  const fmtMoney = (n) => (Number(n||0)).toLocaleString("ru-RU") + " so'm";
  const fmtTime = (t) => { try { return new Date(t).toLocaleString(); } catch(e){ return ""; } };

  const payments = data.payments
    .filter(p => filter==="all" ? true : p.status===filter)
    .filter(p => !q || [p.name,p.role,p.ref,p.uid,p.template].join(" ").toLowerCase().includes(q.toLowerCase()));
  const events = data.events
    .filter(e => !q || [e.name,e.role,e.uid,e.template,e.type].join(" ").toLowerCase().includes(q.toLowerCase()));

  const Stat = ({label, value, color}) => (
    <div style={{background:"#fff",border:"1px solid var(--line)",borderRadius:12,padding:"11px 13px",minWidth:0}}>
      <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".05em",color:"var(--ink-faint)",textTransform:"uppercase"}}>{label}</div>
      <div style={{fontSize:18,fontWeight:800,color:color||"var(--ink)",marginTop:3}}>{value}</div>
    </div>
  );
  const Pill = ({s}) => {
    const m = { pending:["#fef3c7","#b45309","Kutilmoqda"], approved:["#dcfce7","#15803d","Tasdiqlangan"], rejected:["#fee2e2","#dc2626","Rad etilgan"] }[s] || ["#e2e8f0","#475569",s];
    return <span style={{fontSize:9,fontWeight:800,padding:"3px 8px",borderRadius:99,background:m[0],color:m[1],textTransform:"uppercase",letterSpacing:".03em"}}>{m[2]}</span>;
  };

  return (
    <div className="fade-in" style={{position:"fixed",inset:0,zIndex:1100,background:"rgba(15,23,42,.78)",backdropFilter:"blur(5px)",display:"grid",placeItems:"center",padding:14}}>
      <div className="pop" style={{width:"100%",maxWidth:authed?760:380,maxHeight:"92vh",background:"#f8fafc",borderRadius:20,overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 30px 80px rgba(0,0,0,.45)"}}>
        <div style={{background:"#0f172a",color:"#fff",padding:"15px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:9,fontWeight:800,fontSize:15}}>
            <Ic s={17} d={<><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>}/>
            Admin Panel
          </div>
          <button onClick={onClose} style={{width:30,height:30,borderRadius:99,background:"rgba(255,255,255,.16)",color:"#fff",fontSize:17,fontWeight:700}}>×</button>
        </div>

        {!authed ? (
          <div style={{padding:"26px 22px"}}>
            <div style={{textAlign:"center",marginBottom:18}}>
              <div style={{width:54,height:54,borderRadius:16,background:"#eff6ff",color:"var(--brand)",display:"grid",placeItems:"center",margin:"0 auto 12px"}}>
                <Ic s={26} d={<><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>}/>
              </div>
              <div style={{fontWeight:800,fontSize:16}}>Admin kirish</div>
              <div style={{fontSize:12,color:"var(--ink-soft)",marginTop:4}}>Davom etish uchun maxfiy kalitni kiriting</div>
            </div>
            <input className="field" type="password" value={key} onChange={e=>setKey(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")login();}} placeholder="ADMIN_KEY" autoFocus style={{textAlign:"center",letterSpacing:".1em"}}/>
            {err && <div style={{color:"var(--danger)",fontSize:12,textAlign:"center",marginTop:9,fontWeight:600}}>{err}</div>}
            <button className="press" onClick={login} disabled={loading} style={{width:"100%",marginTop:14,background:loading?"#93c5fd":"var(--brand)",color:"#fff",fontWeight:800,fontSize:14,padding:"13px",borderRadius:12}}>
              {loading ? "Tekshirilmoqda..." : "Kirish"}
            </button>
          </div>
        ) : (
          <div style={{overflowY:"auto",padding:"16px"}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
              <Stat label="Foydalanuvchilar" value={data.stats.users||0}/>
              <Stat label="Rezyumelar" value={data.stats.resumes||0}/>
              <Stat label="Yuklab olishlar" value={data.stats.downloads||0}/>
              <Stat label="To'langan" value={data.stats.paid||0} color="#15803d"/>
              <Stat label="Kutilmoqda" value={data.stats.pending||0} color="#b45309"/>
              <Stat label="Daromad" value={fmtMoney(data.stats.revenue)} color="var(--brand)"/>
            </div>

            <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              <button className="press" onClick={()=>setTab("payments")} style={{fontWeight:700,fontSize:12,padding:"7px 13px",borderRadius:9,border:"none",background:tab==="payments"?"#0f172a":"#fff",color:tab==="payments"?"#fff":"var(--ink-soft)"}}>To'lovlar</button>
              <button className="press" onClick={()=>setTab("activity")} style={{fontWeight:700,fontSize:12,padding:"7px 13px",borderRadius:9,border:"none",background:tab==="activity"?"#0f172a":"#fff",color:tab==="activity"?"#fff":"var(--ink-soft)"}}>Faollik</button>
              <input className="field" value={q} onChange={e=>setQ(e.target.value)} placeholder="Qidirish..." style={{flex:1,minWidth:120,padding:"7px 12px",fontSize:12.5}}/>
            </div>

            {tab==="payments" && (
              <>
                <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                  {["all","pending","approved","rejected"].map(f=>(
                    <button key={f} className="press" onClick={()=>setFilter(f)} style={{fontSize:10.5,fontWeight:700,padding:"5px 10px",borderRadius:99,border:filter===f?"1.5px solid var(--brand)":"1px solid var(--line)",background:filter===f?"#eff6ff":"#fff",color:filter===f?"var(--brand)":"var(--ink-soft)"}}>{f}</button>
                  ))}
                </div>
                {payments.length===0 ? <div style={{textAlign:"center",color:"var(--ink-faint)",fontSize:12.5,padding:"24px 0"}}>Hech narsa yo'q</div> :
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {payments.map(p=>(
                      <div key={p.id} style={{background:"#fff",border:"1px solid var(--line)",borderRadius:12,padding:"11px 13px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                          <div style={{minWidth:0}}>
                            <div style={{fontWeight:800,fontSize:13.5}}>{p.name||"—"} <span style={{fontWeight:600,color:"var(--ink-faint)",fontSize:11}}>· {p.role||"—"}</span></div>
                            <div style={{fontSize:11,color:"var(--ink-soft)",marginTop:2}}>Ref: <b>{p.ref}</b> · {p.amount} so'm · {p.template} · {(p.lang||"").toUpperCase()}</div>
                            <div style={{fontSize:10,color:"var(--ink-faint)",marginTop:2}}>{p.uid} · {fmtTime(p.createdAt)}</div>
                          </div>
                          <Pill s={p.status}/>
                        </div>
                        {p.status==="pending" && (
                          <div style={{display:"flex",gap:8,marginTop:10}}>
                            <button className="press" onClick={()=>decide(p.id,"approve")} style={{flex:1,background:"#16a34a",color:"#fff",fontWeight:700,fontSize:12,padding:"8px",borderRadius:9}}>✓ Tasdiqlash</button>
                            <button className="press" onClick={()=>decide(p.id,"reject")} style={{flex:1,background:"#fee2e2",color:"#dc2626",fontWeight:700,fontSize:12,padding:"8px",borderRadius:9}}>✕ Rad etish</button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                }
              </>
            )}

            {tab==="activity" && (
              events.length===0 ? <div style={{textAlign:"center",color:"var(--ink-faint)",fontSize:12.5,padding:"24px 0"}}>Faollik yo'q</div> :
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {events.map(e=>(
                  <div key={e.id} style={{background:"#fff",border:"1px solid var(--line)",borderRadius:10,padding:"9px 12px",display:"flex",alignItems:"center",gap:10}}>
                    <span style={{flexShrink:0,color:e.type==="resume_created"?"var(--brand)":"#16a34a"}}>{e.type==="resume_created"?Icon.layout:Icon.download}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12.5,fontWeight:700}}>{e.type==="resume_created"?"Rezyume yaratildi":"Yuklab olish so'raldi"}</div>
                      <div style={{fontSize:10.5,color:"var(--ink-soft)"}}>{e.name||"—"} · {e.role||"—"} · {(e.lang||"").toUpperCase()} · {e.template}</div>
                    </div>
                    <div style={{fontSize:9.5,color:"var(--ink-faint)",whiteSpace:"nowrap"}}>{fmtTime(e.at)}</div>
                  </div>
                ))}
              </div>
            )}

            {err && <div style={{color:"var(--danger)",fontSize:11,textAlign:"center",marginTop:10}}>{err}</div>}
            <div style={{textAlign:"center",fontSize:9.5,color:"var(--ink-faint)",marginTop:12}}>● Har 5 soniyada yangilanadi</div>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [started, setStarted] = useState(false);
  const [lang, setLang] = useState("uz");
  const [theme, setTheme] = useState("apollo");
  const [step, setStep] = useState(0);
  const [data, setData] = useState(EMPTY);
  const [density, setDensity] = useState(1);
  const [scale, setScale] = useState(100);
  const [busy, setBusy] = useState(false);
  const [sentTg, setSentTg] = useState(false);
  const [blobUrl, setBlobUrl] = useState(null);
  const canvasRef = useRef(null);
  const scrollRef = useRef(null);
  const T = I18N[lang];

  // Desktop = wide viewport (Telegram Desktop / web). Mobile clients stay stacked.
  const [isDesktop, setIsDesktop] = useState(typeof window !== "undefined" && window.innerWidth >= 1024);
  useEffect(()=>{
    const onResize = () => setIsDesktop(window.innerWidth >= 1024);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const fileName = `${(data.personal.fullName||"rezyume").replace(/[^a-zA-Z0-9]/g,"_")}_ai.pdf`;

  // ----- PAYMENT (manual-approval paywall) -----
  const PAY_CARD = "5614 6848 0908 9087";   // <-- replace with YOUR card number
  const PAY_AMOUNT = "4000";                  // UZS, exact
  const [payOpen, setPayOpen] = useState(false);
  const [payStage, setPayStage] = useState("form"); // form | pending | approved | rejected | error
  const [payRef, setPayRef] = useState("");
  const [payId, setPayId] = useState(null);
  const pdfBlobRef = useRef(null); // holds the rendered PDF blob until unlocked
  const pollRef = useRef(null);
  const [adminOpen, setAdminOpen] = useState(false);

  // Stable per-user id (so the global admin can group activity by user)
  const uidRef = useRef(null);
  if (!uidRef.current) {
    try {
      let u = localStorage.getItem("rez_uid");
      if (!u) { u = "u_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); localStorage.setItem("rez_uid", u); }
      uidRef.current = u;
    } catch(e) { uidRef.current = "u_anon"; }
  }
  const logEvent = (type) => {
    try {
      fetch("/api/log-event", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ type, uid: uidRef.current, name: data.personal.fullName||"", role: data.personal.jobTitle||"", lang, template: theme })
      }).catch(()=>{});
    } catch(e){}
  };

  useEffect(()=>{ scrollRef.current?.scrollTo({top:0,behavior:"smooth"}); },[step]);

  // Log a resume_created event once, when the user reaches the final step
  const loggedCreateRef = useRef(false);
  useEffect(()=>{
    if (started && step === TOTAL-1 && !loggedCreateRef.current) {
      loggedCreateRef.current = true;
      logEvent("resume_created");
    }
  }, [started, step]);

  // Telegram main/back button wiring
  useEffect(()=>{
    if(!tg) return;
    if(!started){ tg.BackButton?.hide(); return; }
    if(step>0){ tg.BackButton?.show(); tg.BackButton?.onClick(goBack); }
    else tg.BackButton?.hide();
    return ()=>tg.BackButton?.offClick(goBack);
  });

  const haptic = (t="light") => { try{ tg?.HapticFeedback?.impactOccurred(t); }catch(e){} };
  const goNext = () => { if(step<TOTAL-1){ haptic(); setStep(s=>s+1); } };
  const goBack = () => { if(step>0){ haptic(); setStep(s=>s-1); } else setStarted(false); };

  const loadSample = () => { haptic("medium"); setData(SAMPLE(lang)); };
  const clearAll = () => { haptic(); setData({...EMPTY, languages: EMPTY.languages.map(l=>({...l,id:uid()}))}); };

  /* -------- PDF RENDER (build blob only; download is gated by payment) -------- */
  const renderPDFBlob = async () => {
    let host = null;
    try {
      const src = canvasRef.current;
      if (!src) throw new Error("canvas not found");
      host = document.createElement("div");
      host.style.cssText = "position:fixed;left:-99999px;top:0;width:794px;background:#fff;z-index:-1;";
      const clone = src.cloneNode(true);
      clone.style.transform = "none";
      host.appendChild(clone);
      document.body.appendChild(host);

      await Promise.all(Array.from(host.querySelectorAll("img")).map(img =>
        img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })
      ));
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

      const cw = clone.offsetWidth || 794;
      const ch = Math.max(clone.scrollHeight, clone.offsetHeight, 600);
      if (ch < 50 || cw < 50) throw new Error("invalid size");

      const ratio = window.innerWidth < 768 ? 2 : 2.5;
      const canvas = await html2canvas(clone, {
        scale: ratio, useCORS: true, allowTaint: true, backgroundColor: "#ffffff",
        logging: false, width: cw, height: ch, windowWidth: cw, windowHeight: ch, scrollX: 0, scrollY: 0,
      });
      if (!canvas || !canvas.width || !canvas.height) throw new Error("empty canvas");
      const imgData = canvas.toDataURL("image/png");
      if (!imgData || imgData.length < 5000) throw new Error("empty image");

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:"portrait", unit:"pt", format:"a4" });
      const pw = pdf.internal.pageSize.getWidth();
      const ph = pdf.internal.pageSize.getHeight();
      const imgRatio = canvas.height / canvas.width;
      const rW = pw, rH = pw * imgRatio;
      if (rH <= ph + 1) {
        pdf.addImage(imgData,"PNG",0,0,rW,rH,undefined,"FAST");
      } else {
        let left = rH, pos = 0;
        pdf.addImage(imgData,"PNG",0,pos,rW,rH,undefined,"FAST");
        left -= ph;
        while (left > 0) { pos -= ph; pdf.addPage(); pdf.addImage(imgData,"PNG",0,pos,rW,rH,undefined,"FAST"); left -= ph; }
      }
      return pdf;
    } finally {
      if (host && host.parentNode) host.parentNode.removeChild(host);
    }
  };

  // Actually deliver the file (only called after payment is approved)
  const deliverPDF = (pdf) => {
    try { pdf.save(fileName); } catch(e){}
    try {
      const blob = pdf.output("blob");
      if (blob && blob.size > 0) setBlobUrl(URL.createObjectURL(blob));
    } catch(e){}
    if (window.confetti) confetti({ particleCount:160, spread:90, origin:{y:.6} });
  };

  // Step 1: user clicks Download → render the PDF, then open the paywall
  const generatePDF = async () => {
    if (busy) return;
    setBusy(true); setBlobUrl(null);
    haptic("medium");
    try {
      const pdf = await renderPDFBlob();
      pdfBlobRef.current = pdf;
      logEvent("download_requested");
      // open payment modal instead of downloading
      setPayRef(""); setPayId(null); setPayStage("form"); setPayOpen(true);
    } catch (err) {
      console.error("PDF render failed:", err);
      alert("PDF xatosi: " + (err?.message||err));
    } finally {
      setBusy(false);
    }
  };

  // Step 2: user submits they paid → create pending request on backend
  const submitPayment = async () => {
    if (!payRef.trim()) { alert(T.payRefErr); return; }
    haptic("medium");
    try {
      setPayStage("pending");
      const res = await fetch("/api/pay-create", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ ref: payRef.trim(), amount: PAY_AMOUNT, name: data.personal.fullName || "", role: data.personal.jobTitle || "", lang, template: theme, uid: uidRef.current })
      });
      const j = await res.json();
      if (!j.ok || !j.id) throw new Error(j.error || "create failed");
      setPayId(j.id);
      startPolling(j.id);
    } catch (e) {
      console.error("pay-create failed:", e);
      setPayStage("error");
    }
  };

  // Step 3: poll until you approve/reject in the admin page
  const startPolling = (id) => {
    if (pollRef.current) clearInterval(pollRef.current);
    pollRef.current = setInterval(async () => {
      try {
        const res = await fetch("/api/pay-status?id=" + encodeURIComponent(id));
        const j = await res.json();
        if (j.status === "approved") {
          clearInterval(pollRef.current); pollRef.current = null;
          setPayStage("approved");
          haptic("medium");
          setTimeout(() => {
            if (pdfBlobRef.current) deliverPDF(pdfBlobRef.current);
            setPayOpen(false);
          }, 1200);
        } else if (j.status === "rejected") {
          clearInterval(pollRef.current); pollRef.current = null;
          setPayStage("rejected");
        }
      } catch(e) { /* keep polling */ }
    }, 3000);
  };

  useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  const closePay = () => {
    if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
    setPayOpen(false); setPayStage("form");
  };

  // WELCOME SCREEN
  if (!started) return <Welcome lang={lang} setLang={setLang} onStart={()=>{haptic("medium");setStarted(true);setStep(0);}} />;

  const stepEl = [
    <StepLanguage lang={lang} setLang={setLang} />,
    <StepDesign lang={lang} theme={theme} setTheme={setTheme} onSample={loadSample} onClear={clearAll} />,
    <StepPersonal lang={lang} data={data} set={setData} />,
    <StepAbout lang={lang} data={data} set={setData} />,
    <StepWork lang={lang} data={data} set={setData} />,
    <StepEducation lang={lang} data={data} set={setData} />,
    <StepSkills lang={lang} data={data} set={setData} />,
    <StepCerts lang={lang} data={data} set={setData} />,
    <StepLangs lang={lang} data={data} set={setData} />,
    <StepReview lang={lang} density={density} setDensity={setDensity} scale={scale} setScale={setScale} />,
    <StepDone lang={lang} onDownload={generatePDF} busy={busy} sentTg={sentTg} blobUrl={blobUrl} fileName={fileName} />,
  ][step];

  const pct = Math.round(((step+1)/TOTAL)*100);

  return (
    <div className={"app-shell" + (isDesktop ? " desktop" : "")}>
      {/* TOP BAR */}
      <div style={{position:"sticky",top:0,zIndex:20,background:"rgba(255,255,255,.85)",backdropFilter:"blur(12px)",borderBottom:"1px solid var(--line)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px"}}>
          <div style={{width:34,height:34,borderRadius:10,background:"var(--brand)",color:"#fff",display:"grid",placeItems:"center"}}>{Icon.logo}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontWeight:800,fontSize:15}}>Resyume AI</span><span style={{fontSize:8,fontWeight:800,color:"var(--brand)",background:"#eff6ff",padding:"1px 5px",borderRadius:5}}>V2.0</span></div>
            <div style={{fontSize:8.5,letterSpacing:".08em",color:"var(--ink-faint)",fontWeight:700}}>{T.appSub}</div>
          </div>
          {isDesktop && (
            <div style={{display:"flex",gap:5,marginRight:8}}>
              {["uz","ru","en"].map(l=>(
                <button key={l} onClick={()=>setLang(l)} className="press" style={{fontSize:10,fontWeight:800,padding:"5px 10px",borderRadius:99,border:lang===l?"none":"1px solid var(--line)",background:lang===l?"var(--brand)":"#fff",color:lang===l?"#fff":"var(--ink-soft)"}}>{l.toUpperCase()}</button>
              ))}
            </div>
          )}
          <div style={{fontSize:11,fontWeight:800,color:"var(--ink-soft)"}}>{step+1}/{TOTAL}</div>
        </div>
        <div style={{height:3,background:"var(--line-soft)"}}><div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,var(--brand),var(--sky))",transition:"width .4s cubic-bezier(.16,1,.3,1)"}}/></div>
      </div>

      {/* SCROLL BODY */}
      <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding: isDesktop ? "0" : "16px 16px 0"}}>
        {/* BANNER (mobile only — desktop shows it above preview) */}
        {!isDesktop && (
          <div style={{background:"#0f172a",borderRadius:16,padding:"13px 16px",color:"#fff",marginBottom:14,position:"relative",overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:7,fontWeight:800,fontSize:12.5}}><span style={{color:"var(--sky)"}}>{Icon.info}</span>{T.bannerTitle}</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>{T.bannerBody}</div>
            <div style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",color:"#1e293b",animation:"bounceDown 1.8s infinite"}}><Ic s={30} d={<path d="M12 5v14M6 13l6 6 6-6"/>}/></div>
          </div>
        )}

        <div className="work-grid">
          {/* EDITOR COLUMN */}
          <div className="editor-col">
            <div key={step} style={{background:"var(--panel)",borderRadius:18,border:"1px solid var(--line)",boxShadow:"var(--shadow-sm)",padding:16,marginBottom:14}}>
              {stepEl}
              {/* NAV */}
              {step<TOTAL-1 && (
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",borderTop:"1px solid var(--line)",marginTop:18,paddingTop:14}}>
                  <button className="press" onClick={goBack} style={{display:"flex",alignItems:"center",gap:6,background:"#f1f5f9",color:"var(--ink-soft)",fontWeight:700,fontSize:13,padding:"10px 16px",borderRadius:11}}>{Icon.arrowL}{T.back}</button>
                  <span style={{fontSize:10,fontWeight:800,letterSpacing:".06em",color:"var(--ink-faint)"}}>{T.step} {step+1} / {TOTAL}</span>
                  <button className="press" onClick={goNext} style={{display:"flex",alignItems:"center",gap:6,background:"var(--brand)",color:"#fff",fontWeight:700,fontSize:13,padding:"10px 18px",borderRadius:11,boxShadow:"0 6px 16px var(--brand-glow)"}}>{T.next}{Icon.arrowR}</button>
                </div>
              )}
              {step===TOTAL-1 && (
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",borderTop:"1px solid var(--line)",marginTop:18,paddingTop:14}}>
                  <button className="press" onClick={goBack} style={{display:"flex",alignItems:"center",gap:6,background:"#f1f5f9",color:"var(--ink-soft)",fontWeight:700,fontSize:13,padding:"10px 16px",borderRadius:11}}>{Icon.arrowL}{T.back}</button>
                </div>
              )}
            </div>
          </div>

          {/* PREVIEW COLUMN */}
          <div className="preview-col">
            {isDesktop && (
              <div style={{background:"#0f172a",borderRadius:16,padding:"13px 16px",color:"#fff",marginBottom:14,position:"relative",overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:7,fontWeight:800,fontSize:12.5}}><span style={{color:"var(--sky)"}}>{Icon.info}</span>{T.bannerTitle}</div>
                <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>{T.bannerBody}</div>
              </div>
            )}
            <div style={{marginBottom:18}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:9,color:"var(--ink-soft)",fontWeight:800,fontSize:11,letterSpacing:".05em"}}>{Icon.eye} LIVE PREVIEW</div>
              <PreviewPane data={data} lang={lang} density={density} scale={scale} canvasRef={canvasRef} tpl={getTpl(theme)} />
            </div>
          </div>
        </div>

        <div style={{textAlign:"center",fontSize:10,color:"var(--ink-faint)",fontWeight:600,padding:"4px 16px 20px"}}>
          Resyume AI orqali shakllantirildi • © 2026 Resyume AI Engine
          <span onClick={()=>setAdminOpen(true)} title="" style={{display:"inline-block",marginLeft:8,opacity:.25,cursor:"default",verticalAlign:"middle"}}>
            <Ic s={11} d={<><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>} sw={2.2}/>
          </span>
        </div>
      </div>

      {adminOpen && <AdminPanel onClose={()=>setAdminOpen(false)} lang={lang} />}
      {payOpen && (
        <PaymentModal
          lang={lang} card={PAY_CARD} amount={PAY_AMOUNT}
          stage={payStage} payRef={payRef} setPayRef={setPayRef}
          onSubmit={submitPayment} onClose={closePay}
        />
      )}
    </div>
  );
}

/* ================================================================
   WELCOME
================================================================ */
function Welcome({ lang, setLang, onStart }) {
  const T = I18N[lang];
  return (
    <div className="app-shell" style={{justifyContent:"center",padding:"24px 22px",position:"relative",overflow:"hidden"}}>
      {/* atmosphere */}
      <div style={{position:"absolute",top:-90,right:-70,width:260,height:260,borderRadius:"50%",background:"radial-gradient(circle,rgba(56,189,248,.22),transparent 70%)"}}/>
      <div style={{position:"absolute",bottom:-100,left:-80,width:280,height:280,borderRadius:"50%",background:"radial-gradient(circle,rgba(37,99,235,.18),transparent 70%)"}}/>

      <div className="fade-up" style={{position:"relative",zIndex:2}}>
        {/* lang switch */}
        <div style={{display:"flex",justifyContent:"center",gap:6,marginBottom:30}}>
          {["uz","ru","en"].map(l=>(
            <button key={l} onClick={()=>setLang(l)} className="press" style={{fontSize:11,fontWeight:800,letterSpacing:".05em",padding:"6px 13px",borderRadius:99,border:lang===l?"none":"1px solid var(--line)",background:lang===l?"var(--brand)":"#fff",color:lang===l?"#fff":"var(--ink-soft)"}}>{l.toUpperCase()}</button>
          ))}
        </div>

        <div style={{textAlign:"center"}}>
          <div style={{width:78,height:78,borderRadius:22,background:"linear-gradient(135deg,var(--brand),var(--sky))",display:"grid",placeItems:"center",color:"#fff",margin:"0 auto 22px",boxShadow:"0 16px 40px var(--brand-glow)",animation:"float 3.5s ease-in-out infinite"}}>
            <Ic s={38} d={<><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M3 9h6"/></>}/>
          </div>
          <div style={{fontSize:15,fontWeight:700,color:"var(--brand)"}}>👋 {T.welcomeHi(TG_NAME)}</div>
          <h1 style={{fontSize:27,fontWeight:800,letterSpacing:"-.02em",margin:"8px 0 0",lineHeight:1.15}}>{T.welcomeTitle}</h1>
          <p style={{fontSize:14,color:"var(--ink-soft)",lineHeight:1.6,margin:"14px auto 0",maxWidth:380}}>{T.welcomeBody}</p>
        </div>

        {/* feature chips */}
        <div style={{display:"flex",flexDirection:"column",gap:10,margin:"26px auto",maxWidth:380}}>
          {[[Icon.layout,T.feat1],[Icon.eye,T.feat2],[Icon.download,T.feat3]].map(([ic,tx],i)=>(
            <div key={i} className="fade-up" style={{animationDelay:`${.1+i*.08}s`,display:"flex",alignItems:"center",gap:13,background:"#fff",border:"1px solid var(--line)",borderRadius:14,padding:"13px 16px",boxShadow:"var(--shadow-sm)"}}>
              <div style={{width:38,height:38,borderRadius:11,background:"#eff6ff",color:"var(--brand)",display:"grid",placeItems:"center",flexShrink:0}}>{ic}</div>
              <span style={{fontWeight:700,fontSize:13.5}}>{tx}</span>
              <span style={{marginLeft:"auto",color:"var(--good)"}}>{Icon.check}</span>
            </div>
          ))}
        </div>

        <button className="press" onClick={onStart} style={{width:"100%",maxWidth:380,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"center",gap:9,background:"var(--brand)",color:"#fff",fontWeight:800,fontSize:15.5,padding:"16px",borderRadius:15,boxShadow:"0 14px 34px var(--brand-glow)"}}>
          {T.welcomeCta} <span style={{fontSize:18}}>🚀</span>
        </button>
        <div style={{textAlign:"center",fontSize:12,color:"var(--ink-faint)",marginTop:14}}>{T.welcomeHint}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
